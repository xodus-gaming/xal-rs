[package]
name = "xal_examples"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
xal = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
env_logger = "0.11.11"
log = "0.4.33"
clap = { version = "4.6.6", features = ["derive"] }
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.4", features = ["json"] }

# Optional dependencies
wry = { version = "0.56.0", optional = true }

[features]
webview = ["wry"]

[[bin]]
name = "auth_cli"

[[bin]]
name = "auth_azure"

[[bin]]
name = "auth_minecraft"

[[bin]]
name = "auth_halo"

[[bin]]
name = "auth_titlehub"

[[bin]]
name = "xbl_signed_request"

[[bin]]         
name = "auth_webview"
required-features = ["webview"]